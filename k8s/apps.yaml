apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-service
  namespace: parcial2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks-service
  template:
    metadata:
      labels:
        app: tasks-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: tasks-service
          image: ghcr.io/renzoayvar/parcial2-tasks:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: service-credentials
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-service
  namespace: parcial2
spec:
  type: ClusterIP
  selector:
    app: tasks-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
