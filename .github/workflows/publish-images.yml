name: Publish container images

on:
  push:
    branches: [feature/microservicios]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - component: tasks
            context: ./services/tasks
            dockerfile: ./services/tasks/Dockerfile
          - component: projects
            context: ./services/projects
            dockerfile: ./services/projects/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/renzoayvar/parcial2-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/renzoayvar/parcial2-${{ matrix.component }}:latest
